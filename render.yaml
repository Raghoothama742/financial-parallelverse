services:
  - type: web
    name: financial-parallelverse-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8

  - type: web
    name: financial-parallelverse-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend_streamlit/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
